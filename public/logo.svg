<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="256" cy="256" r="240" fill="#0f0b1e" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  
  <!-- Centered 'M' Monogram -->
  <g filter="url(#glow)">
      <!-- 
         Width of M: 200px (from 156 to 356) -> Center 256
         Height of M: 210px (from 150 to 360) -> Center 255
      -->
      <path d="M156 360 V 150 L 256 250 L 356 150 V 360" 
            fill="none" 
            stroke="url(#mainGrad)" 
            stroke-width="32" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
  </g>
</svg>
